<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Diabeties Prediction</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            margin:40px;
        }

        .container{

            width:900px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            text-align:center;
        }

        .grid{

            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:10px;
        }

        input{

            width:100%;
            padding:10px;
        }

        label{

            font-weight:bold;
        }

        button{

            margin-top:25px;
            width:100%;
            padding:15px;
            font-size:18px;
            background:#007BFF;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{

            background:#0056b3;
        }

        h2{

            text-align:center;
        }

    </style>

</head>
<body>

<div class="container">

<h1>Diabeties Prediction using Gaussian Naive Bayes</h1>

<form action="/predict" method="post">

<div class="grid">

{% for feature in features %}

<div>

<label>{{feature}}</label>

<input
type="number"
step="any"
name="{{feature}}"
required>

</div>

{% endfor %}

</div>

<button type="submit">

Predict

</button>

</form>

{% if prediction %}

<h2 style="color:{{color}}">

Prediction : {{prediction}}

</h2>

{% endif %}

</div>

</body>
</html>
