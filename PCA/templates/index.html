<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prediction</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: #161b22;
    padding: 30px;
    border-radius: 12px;
    width: 700px;
    border: 1px solid #30363d;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    font-size: 14px;
    margin-bottom: 6px;
    display: block;
    color: #8b949e;
}

input,
select {
    width: 100%;
    padding: 10px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #e6edf3;
    box-sizing: border-box;
}

input:focus,
select:focus {
    outline: none;
    border-color: #58a6ff;
}

button {
    width: 100%;
    padding: 12px;
    background: #238636;
    border: none;
    border-radius: 6px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #2ea043;
}

.result {
    margin-top: 20px;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="container">

    <h2>Wine Quality Predictor</h2>
    <form action="/predict" method="POST">

        <div class="grid">
            <div>
                <label>Fixed Acidity</label>
                <input type="number" step="any" name="fixed_acidity" placeholder="Fixed Acidity" required>
            </div>
            <div>
                <label>Volatile Acidity</label>
                <input type="number" step="any" name="volatile_acidity" placeholder="volatile Acidity" required>
            </div>
            <div>
                <label>Citric Acid</label>
                <input type="number" step="any" name="citric_acid" placeholder="Citric Acid" required>
            </div>
            <div>
                <label>Residual Sugar</label>
                <input type="number" step="any" name="residual_sugar" placeholder="residual sugar" required>
            </div>
            <div>
                <label>Chlorides</label>
                <input type="number" step="any" name="chlorides" placeholder="chlorides" required>
            </div>

            <div>
                <label>Free Sulfur Dioxide</label>
                <input type="number" step="any" name="free_sulfur_dioxide" placeholder="Free Sulfur Dioxide" required>
            </div>
            <div>
                <label>Total Sulfur Dioxide</label>
                <input type="number" step="any" name="total_sulfur_dioxide" placeholder="Total Sulfur Dioxide" required>
            </div>
            <div>
                <label>Density</label>
                <input type="number" step="any" name="density" placeholder="Density" required>
            </div>
            <div>
                <label>PH</label>
                <input type="number" step="any" name="pH" placeholder="pH" required>
            </div>
            <div>
                <label>Sulphates</label>
                  <input type="number" step="any" name="sulphates" placeholder="Sulphates" required>
            </div>
            <div>
                <label>Alcohol</label>
                   <input type="number" step="any" name="alcohol" placeholder="Alcohol" required>
            </div>
            
        </div>
        <button type="submit">Find Cluster</button>
    </form>

    <div class="result">
        {{ prediction_text }}
    </div>

</div>

</body>
</html>
