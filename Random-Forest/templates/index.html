<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Churn Predictor</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: #161b22;
    padding: 30px;
    border-radius: 12px;
    width: 700px;
    border: 1px solid #30363d;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    font-size: 14px;
    margin-bottom: 6px;
    display: block;
    color: #8b949e;
}

input,
select {
    width: 100%;
    padding: 10px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #e6edf3;
    box-sizing: border-box;
}

input:focus,
select:focus {
    outline: none;
    border-color: #58a6ff;
}

button {
    width: 100%;
    padding: 12px;
    background: #238636;
    border: none;
    border-radius: 6px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #2ea043;
}

.result {
    margin-top: 20px;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="container">

    <h2>Customer Churn Predictor</h2>

    <form action="/predict" method="POST">

        <div class="grid">

            <div>
                <label>Gender</label>
                <select name="gender" required>
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>

            <div>
                <label>Senior Citizen</label>
                <select name="SeniorCitizen" required>
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div>
                <label>Partner</label>
                <select name="Partner" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div>
                <label>Dependents</label>
                <select name="Dependents" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div>
                <label>Tenure (Months)</label>
                <input type="number" name="tenure" required>
            </div>

            <div>
                <label>Phone Service</label>
                <select name="PhoneService" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div>
                <label>Multiple Lines</label>
                <select name="MultipleLines" required>
                    <option value="1">No Phone Service</option>
                    <option value="0">No</option>
                    <option value="2">Yes</option>
                </select>
            </div>

            <div>
                <label>Internet Service</label>
                <select name="InternetService" required>
                    <option value="0">DSL</option>
                    <option value="1">Fiber Optic</option>
                    <option value="2">No</option>
                </select>
            </div>
            <div>
                <label>Online Security</label>
                <select name="OnlineSecurity" required>
                    <option value="1">No Internet Service</option>
                    <option value="0">No</option>
                    <option value="2">Yes</option>
                </select>
            </div>
            <div>
                <label>Online Backup</label>
                <select name="OnlineBackup" required>
                    <option value="1">No Internet Service</option>
                    <option value="0">No</option>
                    <option value="2">Yes</option>
                </select>
            </div>
            <div>
                <label>Device Protection</label>
                <select name="DeviceProtection" required>
                    <option value="1">No Internet Service</option>
                    <option value="0">No</option>
                    <option value="2">Yes</option>
                </select>
            </div>
            <div>
                <label>Tech Support</label>
                <select name="TechSupport" required>
                    <option value="1">No Internet Service</option>
                    <option value="0">No</option>
                    <option value="2">Yes</option>
                </select>
            </div>
            <div>
                <label>Streaming TV</label>
                <select name="StreamingTV" required>
                    <option value="1">No Internet Service</option>
                    <option value="0">No</option>
                    <option value="2">Yes</option>
                </select>
            </div>
            <div>
                <label>Streaming Movies</label>
                <select name="StreamingMovies" required>
                    <option value="1">No Internet Service</option>
                    <option value="0">No</option>
                    <option value="2">Yes</option>
                </select>
            </div>

            <div>
                <label>Contract</label>
                <select name="Contract" required>
                    <option value="0">Month-to-Month</option>
                    <option value="1">One Year</option>
                    <option value="2">Two Year</option>
                </select>
            </div>

            <div>
                <label>Paperless Billing</label>
                <select name="PaperlessBilling" required>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div>
                <label>Payment Method</label>
                <select name="PaymentMethod" required>
                    <option value="2">Electronic Check</option>
                    <option value="3">Mailed Check</option>
                    <option value="0">Bank Transfer</option>
                    <option value="1">Credit Card</option>
                </select>
            </div>

            <div>
                <label>Monthly Charges</label>
                <input type="number" step="0.01" name="MonthlyCharges" required>
            </div>

            <div>
                <label>Total Charges</label>
                <input type="number" step="0.01" name="TotalCharges" required>
            </div>

        </div>

        <button type="submit">
            Predict Churn
        </button>

    </form>

    <div class="result">
        {{ prediction_text }}
    </div>

</div>

</body>
</html>
