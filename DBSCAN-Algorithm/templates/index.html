<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Churn Predictor</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0d1117;
    color: #e6edf3;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background: #161b22;
    padding: 30px;
    border-radius: 12px;
    width: 700px;
    border: 1px solid #30363d;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    font-size: 14px;
    margin-bottom: 6px;
    display: block;
    color: #8b949e;
}

input,
select {
    width: 100%;
    padding: 10px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #e6edf3;
    box-sizing: border-box;
}

input:focus,
select:focus {
    outline: none;
    border-color: #58a6ff;
}

button {
    width: 100%;
    padding: 12px;
    background: #238636;
    border: none;
    border-radius: 6px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #2ea043;
}

.result {
    margin-top: 20px;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="container">

    <h2>People Weight And Height Cluster Predictor</h2>
    <form action="/predict" method="POST">

        <div class="grid">
            <div>
                <label>Weight</label>
                <input type="number" step="0.1" name="weight" required>
            </div>


            <div>
                <label>Height</label>
                <input type="number" step="0.1" name="height" required>
            </div>
        </div>
        <button type="submit">Find Cluster</button>
    </form>

    <div class="result">
        {{ prediction_text }}
    </div>

</div>

</body>
</html>
